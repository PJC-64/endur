name: Build

on: [ workflow_call, workflow_dispatch, push, pull_request ]

jobs:
  build:
    name: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary-suffix: linux-x86_64
            binary-name: endur
          - os: macos-latest
            binary-suffix: macos-x86_64
            binary-name: endur
          - os: windows-latest
            binary-suffix: windows-x86_64
            binary-name: endur.exe
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Check out source files
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --all-features

      - name: Rustfmt
        run: cargo fmt --check

      - name: Cargo Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo Test
        run: cargo test --profile release

      - name: Basic Testing
        continue-on-error: true
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          ${{ github.workspace }}/target/release/${{ matrix.binary-name }} serve &
          sleep 15s
          ${{ github.workspace }}/target/release/${{ matrix.binary-name }} kill

      - name: Basic Testing (Windows)
        continue-on-error: true
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Start-Process -NoNewWindow ${{ github.workspace }}\target\release\${{ matrix.binary-name }} serve
          Start-Sleep -s 15
          ${{ github.workspace }}\target\release\${{ matrix.binary-name }} kill

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: endur-${{ matrix.binary-suffix }}_${{ github.sha }}
          path: ${{ github.workspace }}/target/release/${{ matrix.binary-name }}

